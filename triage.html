<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support Specialist — Triage</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#0d0d1a;color:#fff;padding:20px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    select,input[type=text]{padding:8px;border-radius:6px;border:1px solid #444;background:#0f1020;color:#fff}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:8px;border-bottom:1px solid #222;text-align:left;font-size:13px}
    th{background:rgba(255,255,255,0.02)}
    .suggestions{background:#111;padding:8px;border-radius:6px;margin-top:6px}
    button{padding:6px 10px;border-radius:6px;border:none;background:#29adff;color:#000;cursor:pointer}
    .muted{color:#aaa}
    .small{font-size:12px}
  </style>
</head>
<body>
  <h1>Support Specialist — Triage</h1>
  <div class="controls">
    <label>Status: <select id="statusFilter"><option value="open">Open (default)</option><option value="all">All</option><option value="closed">Closed</option></select></label>
    <label>Product: <select id="productFilter"><option value="">Any</option></select></label>
    <label>Priority: <select id="priorityFilter"><option value="">Any</option></select></label>
    <label>Channel: <select id="channelFilter"><option value="">Any</option></select></label>
    <input id="search" type="text" placeholder="Search subject/description" style="min-width:240px">
  </div>
  <div id="table-wrap"></div>

  <script>
    async function loadData(){
      const [ticketsRes, suggRes] = await Promise.all([
        fetch('data/all_tickets.json'), fetch('data/suggestions_for_all.json')
      ]);
      const tickets = await ticketsRes.json();
      const suggestions = await suggRes.json();
      return {tickets, suggestions};
    }

    function distinct(arr, key){ return Array.from(new Set(arr.map(x=>x[key]||''))).filter(Boolean).sort(); }

    function renderTable(rows, suggestions){
      const wrap = document.getElementById('table-wrap'); wrap.innerHTML='';
      if(rows.length===0){ wrap.innerHTML='<div class="muted">No tickets</div>'; return; }
      const table = document.createElement('table');
      const thead = document.createElement('thead'); const tbody = document.createElement('tbody');
      thead.innerHTML = '<tr><th>Ticket ID</th><th>Subject</th><th>Status</th><th>Priority</th><th>Product</th><th>Channel</th><th>Actions</th></tr>';
      rows.forEach(t=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${t.ticket_id}</td><td>${escapeHtml(t.subject)}</td><td>${escapeHtml(t.status)}</td><td>${escapeHtml(t.priority)}</td><td>${escapeHtml(t.product)}</td><td>${escapeHtml(t.channel)}</td><td></td>`;
        const actionsTd = tr.querySelector('td:last-child');
        const btn = document.createElement('button'); btn.textContent='View suggestions';
        btn.onclick = ()=>{
          const exist = tr.nextElementSibling && tr.nextElementSibling.classList.contains('suggest-row');
          if(exist){ tr.parentElement.removeChild(tr.nextElementSibling); return; }
          const sr = document.createElement('tr'); sr.className='suggest-row';
          const sd = document.createElement('td'); sd.colSpan = 7;
          sd.innerHTML = renderSuggestionsPanel(t, suggestions[t.ticket_id]||[]);
          sr.appendChild(sd);
          tr.parentNode.insertBefore(sr, tr.nextSibling);
        };
        actionsTd.appendChild(btn);
        tbody.appendChild(tr);
      });
      table.appendChild(thead); table.appendChild(tbody); wrap.appendChild(table);
    }

    function renderSuggestionsPanel(ticket, neigh){
      if(!neigh || neigh.length===0) return '<div class="muted">No suggested resolutions found.</div>';
      let html = '<div class="suggestions">';
      html += `<div class="small muted">Suggestions for <strong>${escapeHtml(ticket.subject||ticket.ticket_id)}</strong></div>`;
      neigh.forEach(n=>{
        html += `<div style="margin-top:8px"><div style="font-weight:600">${escapeHtml(n.subject||n.ticket_id)} <span class="small muted">(${n.similarity})</span></div><div class="small">${escapeHtml(n.resolution||'')}</div><div style="margin-top:6px"><button onclick=copyToClipboard(${JSON.stringify(n.resolution||'')})>Copy resolution</button></div></div>`;
      });
      html += '</div>';
      return html;
    }

    function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function copyToClipboard(text){ navigator.clipboard.writeText(text).then(()=>alert('Resolution copied to clipboard')); }

    (async ()=>{
      const {tickets, suggestions} = await loadData();
      // populate filters
      const productList = distinct(tickets,'product');
      const priList = distinct(tickets,'priority');
      const chanList = distinct(tickets,'channel');
      const productSel = document.getElementById('productFilter'); productList.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; productSel.appendChild(o); });
      const prSel = document.getElementById('priorityFilter'); priList.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; prSel.appendChild(o); });
      const chSel = document.getElementById('channelFilter'); chanList.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; chSel.appendChild(o); });

      function applyFilters(){
        const status = document.getElementById('statusFilter').value;
        const product = document.getElementById('productFilter').value;
        const priority = document.getElementById('priorityFilter').value;
        const channel = document.getElementById('channelFilter').value;
        const q = document.getElementById('search').value.toLowerCase().trim();
        let rows = tickets.filter(t=>{
          if(status==='open'){ if((t.status||'').toString().toLowerCase().includes('closed')|| (t.status||'').toString().toLowerCase().includes('resolved')) return false; }
          if(status==='closed'){ if(!((t.status||'').toString().toLowerCase().includes('closed') || (t.status||'').toString().toLowerCase().includes('resolved'))) return false; }
          if(product && t.product !== product) return false;
          if(priority && t.priority !== priority) return false;
          if(channel && t.channel !== channel) return false;
          if(q){ const hay = (t.subject+' '+t.description+' '+t.ticket_id).toLowerCase(); if(hay.indexOf(q)===-1) return false; }
          return true;
        });
        renderTable(rows, suggestions);
      }

      document.getElementById('statusFilter').addEventListener('change', applyFilters);
      document.getElementById('productFilter').addEventListener('change', applyFilters);
      document.getElementById('priorityFilter').addEventListener('change', applyFilters);
      document.getElementById('channelFilter').addEventListener('change', applyFilters);
      document.getElementById('search').addEventListener('input', applyFilters);

      applyFilters();
    })();
  </script>
</body>
</html>
