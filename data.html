<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Data — Customer Support Tickets</title>
  <style>
    body{font-family: Arial, Helvetica, sans-serif; background:#0d0d1a; color:#fff; padding:24px}
    a { color: #29adff }
    #controls{margin-bottom:12px; display:flex; gap:8px; align-items:center}
    input[type=text]{padding:8px; width:320px; border-radius:6px; border:1px solid #444}
    table{width:100%; border-collapse:collapse; margin-top:12px}
    th,td{padding:8px; border-bottom:1px solid #222; text-align:left; font-size:13px}
    th{cursor:pointer; background:rgba(255,255,255,0.02)}
    .pager{margin-top:10px; display:flex; gap:8px; align-items:center}
    .muted{color:#aaa}
    @media (max-width:720px){ input[type=text]{width:100%} table, th, td{font-size:12px} }
  </style>
</head>
<body>
  <a href="index.html">← Back</a>
  <h1>Customer Support Tickets</h1>
  <div id="table-app">
    <div id="controls">
      <input id="search" type="text" placeholder="Search tickets (press Esc to clear)">
      <div class="muted" id="status">Loading…</div>
    </div>
    <div id="table-wrap"></div>
    <div class="pager" id="pager"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="assets/js/data-table.js"></script>
</body>
</html>
